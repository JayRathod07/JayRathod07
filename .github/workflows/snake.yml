# Snake animation generator — runs on a schedule and on push
# Generates the contribution graph snake animation used in the profile README
name: 🐍 One Glass — Contribution Snake

on:
  schedule:
    # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake animation (dark theme — One Glass colors)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#4D9FFF&color_dots=#0d0d1a,#1a1a2e,#2d2d4a,#4D9FFF,#9B59FF
            assets/github-snake.svg?palette=github&color_snake=#4D9FFF

      - name: Commit & push generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate One Glass snake animation [skip ci]"
          branch: main
          file_pattern: assets/github-snake*.svg
