<svg width="900" height="64" viewBox="0 0 900 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="divLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(77,159,255,0)"/>
      <stop offset="20%" stop-color="rgba(77,159,255,0.5)"/>
      <stop offset="50%" stop-color="rgba(155,89,255,0.7)"/>
      <stop offset="80%" stop-color="rgba(0,212,170,0.5)"/>
      <stop offset="100%" stop-color="rgba(0,212,170,0)"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="30%">
      <stop offset="0%" stop-color="rgba(155,89,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(155,89,255,0)"/>
    </radialGradient>
  </defs>
  <rect width="900" height="64" fill="#0a0a0f"/>
  <rect width="900" height="64" fill="url(#centerGlow)"/>
  <!-- The signature divider line -->
  <rect x="60" y="32" width="780" height="1" fill="url(#divLine)"/>
  <!-- Center glass orb on line -->
  <circle cx="450" cy="32" r="5" fill="#9B59FF" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;7;5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="32" r="10" fill="none" stroke="rgba(155,89,255,0.3)" stroke-width="1">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="10;18;10" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
