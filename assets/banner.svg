<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#09090f"/>
      <stop offset="50%"  stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#070710"/>
    </linearGradient>
    <radialGradient id="orb1" cx="75%" cy="30%" r="45%">
      <stop offset="0%"   stop-color="#4D9FFF" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#4D9FFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="20%" cy="70%" r="40%">
      <stop offset="0%"   stop-color="#9B59FF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#9B59FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="0%" r="35%">
      <stop offset="0%"   stop-color="#00D4AA" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00D4AA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="45%"  stop-color="rgba(255,255,255,0.03)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="60%"  stop-color="#e8e8ff"/>
      <stop offset="100%" stop-color="#4D9FFF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bg)"/>

  <!-- Orb glows -->
  <rect width="900" height="220" fill="url(#orb1)"/>
  <rect width="900" height="220" fill="url(#orb2)"/>
  <rect width="900" height="220" fill="url(#orb3)"/>

  <!-- Glass card -->
  <rect x="24" y="20" width="852" height="180" rx="28"
        fill="rgba(255,255,255,0.045)"
        stroke="rgba(255,255,255,0.11)" stroke-width="1.2"/>

  <!-- Top specular shine -->
  <rect x="24" y="20" width="852" height="180" rx="28" fill="url(#shine)"/>

  <!-- Top inner highlight line -->
  <path d="M60 21 Q450 17 840 21" stroke="rgba(255,255,255,0.28)" stroke-width="0.8" fill="none"/>

  <!-- Blue left accent bar -->
  <rect x="50" y="62" width="5" height="56" rx="2.5" fill="#4D9FFF"/>

  <!-- NAME -->
  <text x="68" y="107"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="52" font-weight="800" letter-spacing="-2"
        fill="url(#nameGrad)">Jay Rathod</text>

  <!-- Tagline -->
  <text x="68" y="148"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="17" font-weight="400" letter-spacing="0.2"
        fill="rgba(255,255,255,0.60)">AI / ML Engineer  ·  Building what's next</text>

  <!-- Open to collab pill -->
  <rect x="680" y="158" width="168" height="32" rx="16"
        fill="rgba(77,159,255,0.12)" stroke="rgba(77,159,255,0.38)" stroke-width="1"/>
  <circle cx="700" cy="174" r="5" fill="#4DFFAA"/>
  <text x="714" y="179"
        font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif"
        font-size="12" font-weight="500" fill="rgba(255,255,255,0.82)">Open to collab</text>

  <!-- JR pill (top right) -->
  <rect x="750" y="36" width="96" height="22" rx="11"
        fill="rgba(155,89,255,0.18)" stroke="rgba(155,89,255,0.42)" stroke-width="0.8"/>
  <text x="798" y="51"
        font-family="-apple-system, system-ui, sans-serif"
        font-size="11" font-weight="600" fill="rgba(155,89,255,0.95)" text-anchor="middle">AI · ML · Code</text>

  <!-- Mini decorative dots -->
  <circle cx="820" cy="80" r="1.5" fill="rgba(77,159,255,0.5)"/>
  <circle cx="828" cy="90" r="1"   fill="rgba(155,89,255,0.4)"/>
  <circle cx="812" cy="92" r="1"   fill="rgba(0,212,170,0.5)"/>
</svg>
