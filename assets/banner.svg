<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- One Glass Gradient Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="40%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#080812"/>
    </linearGradient>

    <!-- Liquid Glass specular gradient -->
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.04)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.00)"/>
    </linearGradient>

    <!-- Orb gradient blue -->
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4D9FFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4D9FFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Orb gradient purple -->
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9B59FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#9B59FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Orb gradient teal -->
    <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4AA" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00D4AA" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass panel filter -->
    <filter id="glassBlur" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Clip for card corners -->
    <clipPath id="cardClip">
      <rect x="30" y="30" width="840" height="220" rx="36" ry="36"/>
    </clipPath>

    <!-- Text clip for typewriter animation -->
    <clipPath id="nameClip">
      <rect x="60" y="90" width="0" height="60">
        <animate attributeName="width" from="0" to="560" dur="1.8s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
      </rect>
    </clipPath>

    <clipPath id="taglineClip">
      <rect x="60" y="160" width="0" height="40">
        <animate attributeName="width" from="0" to="500" dur="1.4s" begin="2.3s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
      </rect>
    </clipPath>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="900" height="280" rx="36" fill="url(#bg)"/>

  <!-- ── FLOATING ORBS (One UI glow blobs) ── -->
  <ellipse cx="750" cy="80" rx="180" ry="150" fill="url(#orb1)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 20,-15; -10,8; 0,0" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1"/>
  </ellipse>
  <ellipse cx="150" cy="200" rx="140" ry="120" fill="url(#orb2)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -15,12; 10,-8; 0,0" dur="11s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1"/>
  </ellipse>
  <ellipse cx="460" cy="50" rx="120" ry="100" fill="url(#orb3)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 12,20; -8,-10; 0,0" dur="13s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1"/>
  </ellipse>

  <!-- ── LIQUID GLASS CARD PANEL ── -->
  <rect x="30" y="30" width="840" height="220" rx="36" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
  <!-- Specular top edge highlight (iOS 26 liquid glass signature) -->
  <rect x="30" y="30" width="840" height="220" rx="36" fill="url(#glassShine)"/>
  <!-- Inner thin bright border top -->
  <path d="M66 31 Q450 28 834 31" stroke="rgba(255,255,255,0.35)" stroke-width="0.8" fill="none"/>

  <!-- ── ONE UI PILL ACCENT (signature shape) ── -->
  <rect x="60" y="70" width="6" height="52" rx="3" fill="#4D9FFF">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.2s" fill="freeze"/>
  </rect>

  <!-- ── NAME TEXT ── -->
  <text x="80" y="118" font-family="'SF Pro Display', 'Samsung One UI Sans', -apple-system, system-ui, sans-serif" font-size="46" font-weight="700" letter-spacing="-1.5" fill="white" clip-path="url(#nameClip)">
    Jay Rathod
  </text>

  <!-- ── TAGLINE TEXT ── -->
  <text x="80" y="185" font-family="'SF Pro Text', 'Samsung One UI Sans', -apple-system, system-ui, sans-serif" font-size="18" font-weight="400" letter-spacing="0.3" fill="rgba(255,255,255,0.65)" clip-path="url(#taglineClip)">
    AI / ML Engineer  ·  Building what's next
  </text>

  <!-- ── STATUS PILL (One UI Now-Bar style) ── -->
  <rect x="680" y="195" width="170" height="36" rx="18" fill="rgba(77,159,255,0.15)" stroke="rgba(77,159,255,0.4)" stroke-width="1">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="3s" fill="freeze"/>
  </rect>
  <circle cx="700" cy="213" r="5" fill="#4DFFAA">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="3s" fill="freeze"/>
  </circle>
  <text x="714" y="218" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.85)">
    Open to collab
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="3s" fill="freeze"/>
  </text>

  <!-- ── FLOATING MICRO PILLS (One UI decorative) ── -->
  <rect x="680" y="48" width="60" height="22" rx="11" fill="rgba(155,89,255,0.18)" stroke="rgba(155,89,255,0.4)" stroke-width="0.8">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.5s" fill="freeze"/>
  </rect>
  <text x="710" y="63" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="rgba(155,89,255,0.95)" text-anchor="middle">
    AI · ML
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.5s" fill="freeze"/>
  </text>

  <rect x="750" y="48" width="92" height="22" rx="11" fill="rgba(0,212,170,0.12)" stroke="rgba(0,212,170,0.35)" stroke-width="0.8">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.8s" fill="freeze"/>
  </rect>
  <text x="796" y="63" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="rgba(0,212,170,0.95)" text-anchor="middle">
    Python · JS
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.8s" fill="freeze"/>
  </text>

  <!-- ── LOGO MARK (top left brand mark, unique to jay-rathod) ── -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.1s" fill="freeze"/>
    <!-- J monogram in glass pill -->
    <rect x="60" y="42" width="44" height="22" rx="11" fill="rgba(77,159,255,0.2)" stroke="rgba(77,159,255,0.5)" stroke-width="1"/>
    <text x="82" y="57" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#4D9FFF" text-anchor="middle" letter-spacing="1">JR</text>
  </g>

  <!-- ── SUBTLE GRID LINES (One UI structure) ── -->
  <line x1="30" y1="140" x2="870" y2="140" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="450" y1="30" x2="450" y2="250" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- ── SHIMMER SWEEP (Liquid Glass reflection) ── -->
  <rect x="30" y="30" width="840" height="220" rx="36" fill="none" clip-path="url(#cardClip)">
    <animate attributeName="fill" values="none" dur="1s" repeatCount="indefinite"/>
  </rect>
  <rect x="-200" y="30" width="300" height="220" rx="0" fill="rgba(255,255,255,0.035)" clip-path="url(#cardClip)">
    <animateTransform attributeName="transform" type="translate" values="-200,0; 1100,0" dur="4s" begin="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>
</svg>
